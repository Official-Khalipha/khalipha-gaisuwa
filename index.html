<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shafin Gaisuwa - Khalipha</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;margin:0}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);text-align:center;max-width:400px;width:90%}
h1{color:#333} input{padding:12px;width:80%;border:2px solid #667eea;border-radius:10px;margin:15px 0;font-size:16px}
button{padding:12px 30px;background:#667eea;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer}
button:hover{background:#764ba2} #sakamako{margin-top:20px;padding:15px;background:#f0f0ff;border-radius:10px;display:none;font-size:18px;color:#333}
</style>
</head>
<body>
<div class="card">
<h1>Shafin Gaisuwa 👋</h1>
<p>Daga Khalipha</p>
<input type="text" id="suna" placeholder="Saka sunanka...">
<br>
<button onclick="gaishe()">Gaishe Ni</button>
<div id="sakamako"></div>
</div>
<script>
function gaishe(){
  const suna = document.getElementById('suna').value || 'Aboki';
  const sakamako = document.getElementById('sakamako');
  const gaisuwa = [
    `Sannu ${suna}! 👋 Barka da zuwa shafina!`,
    `Lafiya ${suna}? Allah ya kaimu lafiya!`,
    `Ashe ${suna} ne! Ina murna da ganinka!`,
    `Barka ${suna}! Fatan kana cikin koshin lafiya!`
  ];
  const zaba = gaisuwa[Math.floor(Math.random() * gaisuwa.length)];
  sakamako.innerHTML = zaba;
  sakamako.style.display = 'block';
}
</script>
</body>
</html>
